name: revue-claude

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: revue-claude-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  revue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: "Relis le diff de cette pull request par rapport à origin/main et signale les problèmes réels, en cinq remarques au plus. Poste ta revue en un seul commentaire sur la pull request avec `gh pr comment ${{ github.event.pull_request.number }} --body`, et termine ce commentaire par la ligne exacte `Revue CI — relu par Claude`."
          claude_args: '--max-turns 6 --model sonnet --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*)"'
