name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation du projet
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatage
        run: ruff format --check .

      - name: Tests
        run: pytest
